<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Pembelajaran Interaktif</title>
  <style>
    /* container opsi */
.option-item {
  border: 2px solid #e0e0e0;
  border-radius: 12px;
  padding: 12px 16px;
  margin-bottom: 10px;
  transition: all 0.2s ease;
  background-color: #fff;
  cursor: pointer;
}

/* hover effect */
.option-item:hover {
  background-color: #f8f9fa;
  border-color: #6c63ff;
  transform: translateY(-2px);
}

/* radio disembunyikan */
.option-item input[type="radio"] {
  display: none;
}

/* label full clickable */
.option-item label {
  width: 100%;
  cursor: pointer;
  margin: 0;
}

/* saat dipilih */
.option-item input[type="radio"]:checked + label {
  font-weight: bold;
  color: #046d1c;
}

/* highlight saat dipilih */
.option-item input[type="radio"]:checked + label::before {
  content: "✔ ";
}

/* wrapper selected */
.option-item.selected {
  background: linear-gradient(135deg, #6c63ff, #5a54e6);
  border-color: #6c63ff;
  color: #027120;
}

/* animasi klik */
.option-item:active {
  transform: scale(0.98);
}
  </style>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #0f0000;
    }
    .card {
      border-radius: 15px;
    }
    .option:hover {
      background-color: #f1f1f1;
      cursor: pointer;
    }
  </style>
</head>

<body>

<!-- 🔹 NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <!-- Menu -->
      <ul class="navbar-nav me-auto">
        <li class="nav-item">

        <li class="nav-item">

          <a class="nav-link" href="#"  onclick="loadContent('video', this)">Video Tutorial</a>
        </li>

        </li>

  </div>
</nav>

<!-- Script Logout -->
<script>
    loadContent('beranda',null)

  function logout() {
    alert("Anda telah logout!");
     sessionStorage.setItem("loginUser", []);
    // contoh redirect
    window.location.href = "login.html";
  }

  function loadContent(page,el){
    fetch('pages/' + page + '.html') 
    .then(response => response.text()) 
    .then(data => {
         document.getElementById('content').innerHTML = data; 
        // jalankan quiz setelah HTML masuk
      if (page.includes("quiz")) {
        setTimeout(() => {
          initQuiz();
        }, 100);
      }
        }) 
    .catch(error => {
         document.getElementById('content').innerHTML = "<p>Konten tidak ditemukan</p>"; }); 
        
    document.querySelectorAll('.nav-link').forEach(link => {
    link.classList.remove('active');
    });

    if (el) {
      el.classList.add('active');
    }
 }


// ================= LOGOUT =================
function logout() {
  sessionStorage.removeItem("loginUser");
  window.location.href = "login.html";
}

</script>
<script src="js/quiz.js"></script>
