<script>
    const user = sessionStorage.getItem("loginUser");
    if (!user) {
    window.location.href = "login.html";
    }else{
        const dataUser = JSON.parse(user)
        console.log(dataUser.nama);
        
    }
</script>
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Pembelajaran Interaktif</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<!-- 🔹 NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
  <div class="container">
    <a class="navbar-brand" href="#">E-Learning</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <!-- Menu -->
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" href="#" onclick="loadContent('beranda',this)">Beranda</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#"  onclick="loadContent('materi', this)">Materi</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#"  onclick="loadContent('quiz', this)">Quiz</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Tentang</a>
        </li>
      </ul>

      <!-- Tombol Logout -->
      <button class="btn btn-danger" onclick="logout()">Logout</button>
    </div>
  </div>
</nav>

<!-- 🔹 KONTEN -->
<div class="container mt-4">
  <div class="row">
    <div class="col-md-12" id="content">
      
    </div>
  </div>
</div>

<!-- 🔹 FOOTER -->
<footer class="bg-dark text-white text-center py-3 mt-5 fixed-bottom" >
  <p class="mb-0">&copy; 2026 Web Pembelajaran | Dibuat dengan Bootstrap</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Script Logout -->
<script>
    

  function logout() {
    alert("Anda telah logout!");
     sessionStorage.setItem("loginUser", []);
    // contoh redirect
    window.location.href = "login.html";
  }

  function loadContent(page,el){
    fetch('pages/' + page + '.html') 
    .then(response => response.text()) 
    .then(data => {
         document.getElementById('content').innerHTML = data; }) 
    .catch(error => {
         document.getElementById('content').innerHTML = "<p>Konten tidak ditemukan</p>"; }); 
        
          document.querySelectorAll('.nav-link').forEach(link => {
      link.classList.remove('active');
    });

    if (el) {
      el.classList.add('active');
    }
 }
</script>

</body>
</html>
