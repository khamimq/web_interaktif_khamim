<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BIDIK - Teknik Camera Angle</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  background:#edf2fb;
  overflow-x:hidden;
}

/* ===================== */
/* SIDEBAR */
/* ===================== */

.sidebar{
  width:280px;
  min-height:100vh;
  background:linear-gradient(180deg,#071739,#0c2c67);
  position:fixed;
  padding:30px 22px;
  color:white;
}

.logo{
  font-size:55px;
  font-weight:800;
  line-height:1;
}

.logo span{
  color:#ffc107;
}

.tagline{
  margin-top:12px;
  color:#dce7ff;
  font-size:13px;
  line-height:1.8;
}

.sidebar hr{
  margin:28px 0;
  border-color:rgba(255,255,255,.1);
}

.menu-title{
  color:#ffc107;
  font-size:20px;
  font-weight:700;
  margin-bottom:20px;
}

.menu-item{
  display:flex;
  align-items:center;
  gap:12px;
  text-decoration:none;
  color:white;
  padding:15px 18px;
  border-radius:15px;
  margin-bottom:5px;
  background:rgba(255,255,255,.05);
  transition:.3s;
  font-size:15px;
}

.menu-item:hover{
  background:#ffc107;
  color:#071739;
  transform:translateX(4px);
}

.menu-item.active{
  background:#ffc107;
  color:#071739;
  font-weight:600;
}

.menu-item i{
  font-size:18px;
}

/* ===================== */
/* MAIN CONTENT */
/* ===================== */

.main-content{
  margin-left:280px;
  padding:35px;
}

/* ===================== */
/* HERO */
/* ===================== */

.hero{
  background:linear-gradient(135deg,#071739,#18418a);
  border-radius:28px;
  padding:45px;
  color:white;
  position:relative;
  overflow:hidden;
}

.hero::before{
  content:'';
  width:300px;
  height:300px;
  background:#ffc107;
  position:absolute;
  border-radius:50%;
  top:-120px;
  right:-120px;
  opacity:.15;
}

.hero h1{
  font-size:58px;
  font-weight:800;
  line-height:1.1;
}

.hero h1 span{
  color:#ffc107;
}

.hero p{
  margin-top:20px;
  line-height:1.9;
  color:#dce7ff;
  font-size:17px;
}

.hero-img{
  width:100%;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.btn-custom{
  padding:13px 24px;
  border-radius:14px;
  font-weight:600;
  border:none;
  font-size:15px;
}

.btn-yellow{
  background:#ffc107;
  color:#071739;
}

.btn-yellow:hover{
  background:#ffcf33;
}

/* ===================== */
/* SECTION */
/* ===================== */

.section-title{
  margin-top:55px;
  margin-bottom:25px;
}

.section-title h2{
  font-size:36px;
  font-weight:800;
  color:#071739;
}

.section-title p{
  margin-top:10px;
  color:#666;
  font-size:16px;
  line-height:1.8;
}

/* ===================== */
/* FUNCTION CARD */
/* ===================== */

.function-card{
  background:white;
  border-radius:22px;
  padding:25px;
  box-shadow:0 5px 18px rgba(0,0,0,.05);
  height:100%;
  transition:.3s;
}

.function-card:hover{
  transform:translateY(-5px);
}

.function-icon{
  width:55px;
  height:55px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  margin-bottom:18px;
}

.blue{
  background:#dbe8ff;
  color:#0d47a1;
}

.yellow{
  background:#fff3cd;
  color:#ff9800;
}

.green{
  background:#d1f7e3;
  color:#1b8a5a;
}

.function-card h5{
  font-weight:700;
  color:#071739;
  font-size:18px;
}

.function-card p{
  margin-top:10px;
  color:#666;
  line-height:1.8;
  font-size:14px;
}

/* ===================== */
/* ANGLE CARD */
/* ===================== */

.angle-card{
  background:white;
  border-radius:28px;
  padding:30px;
  margin-top:35px;
  box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.angle-image{
  width:100%;
  border-radius:20px;
  object-fit:cover;
}

.badge-angle{
  display:inline-block;
  padding:8px 18px;
  border-radius:30px;
  font-size:13px;
  font-weight:600;
  margin-bottom:15px;
}

.angle-content h3{
  font-size:32px;
  font-weight:700;
  color:#071739;
}

.info-box{
  margin-top:18px;
}

.info-box h6{
  font-weight:700;
  color:#071739;
  margin-bottom:8px;
}

.info-box p,
.info-box li{
  color:#555;
  line-height:1.8;
  font-size:15px;
}

.info-box ul{
  padding-left:18px;
}

/* ===================== */
/* TIPS */
/* ===================== */

.tips-box{
  background:white;
  border-radius:25px;
  padding:30px;
  box-shadow:0 5px 18px rgba(0,0,0,.05);
}

.tip-item{
  display:flex;
  gap:15px;
  margin-bottom:20px;
}

.tip-icon{
  min-width:45px;
  height:45px;
  border-radius:12px;
  background:#fff3cd;
  color:#ff9800;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

/* ===================== */
/* CASE */
/* ===================== */

.case-box{
  background:linear-gradient(135deg,#071739,#18418a);
  border-radius:25px;
  padding:35px;
  color:white;
}

.case-box p{
  color:#dce7ff;
  line-height:1.9;
}

/* ===================== */
/* FOOTER */
/* ===================== */

.footer{
  margin-top:60px;
  background:#071739;
  border-radius:25px;
  padding:30px;
  text-align:center;
  color:white;
}

.footer p{
  color:#dce7ff;
  margin-top:8px;
}

/* ===================== */
/* RESPONSIVE */
/* ===================== */

@media(max-width:992px){

  .sidebar{
    width:100%;
    position:relative;
    min-height:auto;
  }

  .main-content{
    margin-left:0;
    padding:20px;
  }

  .hero{
    padding:30px;
  }

  .hero h1{
    font-size:40px;
  }

}

</style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

  <div class="logo">
    BID<span>IK</span>
  </div>

  <div class="tagline">
    Belajar Inspirasi <br>
    dan Instruksi Kamera
  </div>
  <a href="#" class="menu-item" onclick="loadContent('beranda',this)">
    <i class="bi bi-camera"></i>
    Beranda
  </a>

  <a href="#" class="menu-item" onclick="loadContent('materi', this)">
    <i class="bi bi-aspect-ratio"></i>
    Materi
  </a>

  <a href="#" class="menu-item" onclick="loadContent('video', this)">
    <i class="bi bi-file-earmark-play"></i>
    Video Pembelajaran
  </a>
  <a href="#" class="menu-item" onclick="loadContent('lkpd', this)">
    <i class="bi bi-list-task"></i>
    LKPD Digital
  </a>
  <a href="#" class="menu-item" onclick="loadContent('quiz', this)">
    <i class="bi bi-trophy-fill"></i>
    Quiz
  </a>
  <a href="#" class="menu-item" onclick="loadContent('karya', this)">
    <i class="bi bi-person-rolodex"></i>
    Contoh Karya
  </a>
  <a href="#" class="menu-item" onclick="loadContent('tugas', this)">
    <i class="bi bi-cloud-upload-fill"></i>
    Pengumpulan Karya
  </a>
  <a href="#" class="menu-item" onclick="loadContent('tentang', this)">
    <i class="bi bi-info-circle-fill"></i>
    Tentang Kami
  </a>

</div>

<!-- MAIN -->

<div class="main-content" id="content">

 

  <!-- FOOTER -->

  <div class="footer">

    <h4>
      SMKN 1 Ponorogo
    </h4>

    <p>
      Kreatif • Kompeten • Siap Kerja • Siap Berkarya
    </p>

  </div>

</div>

</body>
</html>
<script>
     loadContent('beranda',null)

  function logout() {
    alert("Anda telah logout!");
     sessionStorage.setItem("loginUser", []);
    // contoh redirect
    window.location.href = "login.html";
  }
     function loadContent(page,el){
    fetch('pages/' + page + '.html') 
    .then(response => response.text()) 
    .then(data => {
         document.getElementById('content').innerHTML = data; 
        // jalankan quiz setelah HTML masuk
      if (page.includes("quiz")) {
        setTimeout(() => {
          initQuiz();
        }, 100);
      }
        }) 
    .catch(error => {
         document.getElementById('content').innerHTML = "<p>Konten tidak ditemukan</p>"; }); 
        
    document.querySelectorAll('.menu-item').forEach(link => {
    link.classList.remove('active');
    });

    if (el) {
      el.classList.add('active');
    }
 }
</script>
