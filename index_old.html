    /* container opsi */
.option-item {
  border: 2px solid #e0e0e0;
  border-radius: 12px;
  padding: 12px 16px;
  margin-bottom: 10px;
  transition: all 0.2s ease;
  background-color: #fff;
  cursor: pointer;
}

/* hover effect */
.option-item:hover {
  background-color: #f8f9fa;
  border-color: #6c63ff;
  transform: translateY(-2px);
}

/* radio disembunyikan */
.option-item input[type="radio"] {
  display: none;
}

/* label full clickable */
.option-item label {
  width: 100%;
  cursor: pointer;
  margin: 0;
}

/* saat dipilih */
.option-item input[type="radio"]:checked + label {
  font-weight: bold;
  color: #046d1c;
}

/* highlight saat dipilih */
.option-item input[type="radio"]:checked + label::before {
  content: "✔ ";
}

/* wrapper selected */
.option-item.selected {
  background: linear-gradient(135deg, #6c63ff, #5a54e6);
  border-color: #6c63ff;
  color: #027120;
}

/* animasi klik */
.option-item:active {
  transform: scale(0.98);
}
