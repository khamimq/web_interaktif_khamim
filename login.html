<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login Siswa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card shadow">
        <div class="card-body">
          <h4 class="text-center">Login Siswa</h4>

          <input type="text" id="username" class="form-control mt-3" placeholder="Username">
          <input type="password" id="password" class="form-control mt-2" placeholder="Password">

          <button class="btn btn-primary w-100 mt-3" onclick="login()">Login</button>

          <p id="error" class="text-danger mt-2 text-center"></p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let users = [];

// ambil data json
fetch('data/siswa.json')
  .then(res => res.json())
  .then(data => {
    users = data;
  })
  .catch(err => {
    console.error("Gagal load JSON:", err);
  });

function login() {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();

  const user = users.find(u => 
    u.username === username && u.password === password
  );

  if (user) {
    sessionStorage.setItem("loginUser", JSON.stringify(user));
    window.location.href = "index.html";
  } else {
    document.getElementById("error").innerText = "Username atau password salah!";
  }
}
</script>

</body>
</html>
